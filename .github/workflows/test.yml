name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.14"
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install "PyYAML==6.0.3"
      - run: python -m unittest discover -v
      - run: python -m compileall -q .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install "ruff==0.17.6"
      - run: ruff check .
      - run: ruff format --check .

  hermes-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HERMES_INTEGRATION_REQUIRED: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: >-
          python -m pip install
          "PyYAML==6.0.3"
          "httpx==0.28.1"
          "packaging==26.3"
          "psutil==7.2.2"
          "requests==2.34.2"
          "rich==14.3.4"
          "ruamel.yaml==0.18.16"
      - run: >-
          python -m pip install --no-deps --editable
          "git+https://github.com/NousResearch/hermes-agent.git@caafe5389ae585ef77387a962aee05b1bcf17029#egg=hermes-agent"
      - name: Validate Hermes admission
        run: >-
          python -m unittest -v
          tests.test_hermes_integration.HermesIntegrationTests.test_admission_validation
      - name: Verify Hermes runtime discovery
        run: >-
          python -m unittest -v
          tests.test_hermes_integration.HermesIntegrationTests.test_runtime_discovery
      - name: Verify denied approval blocks dispatch
        run: >-
          python -m unittest -v
          tests.test_hermes_integration.HermesIntegrationTests.test_hermes_denial_blocks_export_before_dispatch
      - name: Verify approval failure blocks dispatch
        run: >-
          python -m unittest -v
          tests.test_hermes_integration.HermesIntegrationTests.test_hermes_approval_failure_blocks_export
